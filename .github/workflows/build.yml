name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease && cp app/build/outputs/apk/release/app-release.apk OverlayLauncher.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: OverlayLauncher.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: Overlay Launcher 1.2
          target_commitish: ${{ github.sha }}
          files: OverlayLauncher.apk
