plugins { id 'com.android.application' }
android {
    namespace 'fr.overlay.launcher'
    compileSdk 34
    defaultConfig { applicationId 'fr.overlay.launcher'; minSdk 26; targetSdk 34; versionCode 6; versionName '2.1' }
    signingConfigs {
        release { storeFile file('release.jks'); storePassword 'overlay'; keyAlias 'key'; keyPassword 'overlay' }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
